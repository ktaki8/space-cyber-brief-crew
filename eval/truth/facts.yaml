    - {id: duration_cert, pattern: '(7|seven)[-\s]hours?'}
    - {id: not_confirmed, pattern: '(not|un)[- ]?confirmed|possible', critical: true}
  conflict:
    # A sound brief surfaces the disagreement rather than choosing silently.
    - {id: cause_dispute, pattern: 'conflict|disagree|differ|contradict|while .{0,60}(vendor|cert)|however|in contrast|discrepan'}
